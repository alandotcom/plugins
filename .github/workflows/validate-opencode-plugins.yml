name: Validate OpenCode plugins

on:
  pull_request:
    paths:
      - "opencode/**"
      - "thermos/**"
      - "pstack/**"
      - "package*.json"
      - "scripts/check-opencode-plugin.mjs"
      - ".github/workflows/validate-opencode-plugins.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
